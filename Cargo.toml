[package]
name = "fix-whxm4-voice"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
aes = "0.9.3"
cbc = "0.2.1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.5.2"
ecb = "0.2.1"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "encoder", "optimization"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
ureq = "3.4.2"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "macros"] }

# Bluetooth goes through Winsock on Windows (ADR 0007).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    # WSAQUERYSETW, the SDP query, points at a BLOB from here.
    "Win32_System_Com",
] }
